
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFCFB" />
    <meta name="application-name" content="HAVEN" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HAVEN" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>HAVEN | La colocation flexible</title>
    
    <!-- Fonts: DM Sans (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              haven: {
                navy: '#1E293B',      // Slate 800
                red: '#A34343',       // Terracotta
                cream: '#FDFCFB',     // Sable/Crème
                gray: '#F1F5F9',      // Slate 100
                stone: '#78716C',     // Stone 600
              }
            },
            fontFamily: {
              heading: ['DM Sans', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
              'premium': '0 20px 50px -12px rgba(30, 41, 59, 0.1)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FDFCFB;
        color: #1E293B;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100dvh;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .mobile-bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
      .haven-dual-range {
        position: relative;
        height: 28px;
      }
      .haven-dual-range-track,
      .haven-dual-range-selection {
        position: absolute;
        top: 12px;
        height: 4px;
        border-radius: 999px;
      }
      .haven-dual-range-track {
        right: 0;
        left: 0;
        background: #E5E7EB;
      }
      .haven-dual-range-selection {
        background: #B24A4A;
      }
      .haven-dual-range-input {
        pointer-events: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 28px;
        margin: 0;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
      }
      .haven-dual-range-input::-webkit-slider-runnable-track {
        height: 4px;
        background: transparent;
      }
      .haven-dual-range-input::-moz-range-track {
        height: 4px;
        background: transparent;
      }
      .haven-dual-range-input::-webkit-slider-thumb {
        pointer-events: auto;
        width: 22px;
        height: 22px;
        margin-top: -9px;
        border: 1px solid #E5E7EB;
        border-radius: 999px;
        appearance: none;
        -webkit-appearance: none;
        background: #FFFFFF;
        box-shadow: 0 1px 3px rgba(30, 41, 59, 0.16);
        cursor: grab;
      }
      .haven-dual-range-input::-moz-range-thumb {
        pointer-events: auto;
        width: 20px;
        height: 20px;
        border: 1px solid #E5E7EB;
        border-radius: 999px;
        background: #FFFFFF;
        box-shadow: 0 1px 3px rgba(30, 41, 59, 0.16);
        cursor: grab;
      }
      .haven-dual-range-min { z-index: 2; }
      .haven-dual-range-max { z-index: 3; }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'DM Sans', sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #FDFCFB; }
      ::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #CBD5E1; }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes haven-breathe {
        0%, 100% { transform: scale(0.97); opacity: 0.78; }
        50% { transform: scale(1.03); opacity: 1; }
      }
    </style>
    
    <script>
      window.global = window;
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100dvh;background:#FDFCFB;font-family:Inter,sans-serif;color:#1E293B;">
        <div style="text-align:center;">
          <img src="/logo.png" alt="HAVEN" style="width:190px;height:auto;animation:haven-breathe 1.8s ease-in-out infinite;" />
          <p style="margin:18px 0 0;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#78716C;">La colocation flexible</p>
        </div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
